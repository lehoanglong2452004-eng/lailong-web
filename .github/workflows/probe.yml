name: probe
on:
  push:
    branches: [probe]
    paths: [probe/markets.py, probe/probe.py]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p probe/out && python3 probe/markets.py probe/out 2>&1 | tee probe/out/log.txt
      - run: |
          git config user.name lailong-bot; git config user.email lailong-bot@users.noreply.github.com
          git add probe/out; git commit -qm "probe result"; git push -q origin HEAD:probe
