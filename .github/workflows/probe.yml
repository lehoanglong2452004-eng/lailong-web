name: probe
on:
  push:
    branches: [probe]
    paths: [probe/probe.py]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name lailong-bot; git config user.email lailong-bot@users.noreply.github.com
          git add probe/result.json; git commit -qm "probe result"; git push -q origin HEAD:probe
